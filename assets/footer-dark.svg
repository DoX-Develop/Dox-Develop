<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Pied de page : © 2026 DoX, Développeur Full-Stack, Libreville, Gabon">
  <title>© 2026 DoX · Développeur Full-Stack · Libreville, Gabon</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="170" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#050816"/><stop offset="0.55" stop-color="#101a50"/><stop offset="0.88" stop-color="#3a2a78"/><stop offset="1" stop-color="#c0583c"/></linearGradient>
    <linearGradient id="tint" x1="0" y1="30" x2="0" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#02030c" stop-opacity="0.40"/><stop offset="1" stop-color="#02030c" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="30" x2="0" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.03"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="edge" x1="70" y1="30" x2="1130" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dbe8ff" stop-opacity="0"/><stop offset="0.5" stop-color="#dbe8ff" stop-opacity="0.30"/><stop offset="1" stop-color="#dbe8ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="panel"><rect x="70" y="30" width="1060" height="110" rx="28"/></clipPath>
    <filter id="frost" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="170"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="cloud" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
    <g id="sky">
      <g fill="#ffffff"><circle cx="543" cy="102" r="1.2"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="5.6s" begin="-4.2s" repeatCount="indefinite"/></circle><circle cx="1105" cy="11" r="1.7"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="5.8s" begin="-1.2s" repeatCount="indefinite"/></circle><circle cx="126" cy="28" r="1.0"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.9s" begin="-1.2s" repeatCount="indefinite"/></circle><circle cx="1133" cy="21" r="1.4"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.5s" begin="-1.1s" repeatCount="indefinite"/></circle><circle cx="592" cy="31" r="1.7"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="5.8s" begin="-0.8s" repeatCount="indefinite"/></circle><circle cx="167" cy="25" r="1.5"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.8s" begin="-0.7s" repeatCount="indefinite"/></circle><circle cx="30" cy="34" r="1.6"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="6.4s" begin="-0.8s" repeatCount="indefinite"/></circle><circle cx="360" cy="45" r="1.2"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.1s" begin="-4.4s" repeatCount="indefinite"/></circle><circle cx="439" cy="31" r="1.7"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="5.6s" begin="-4.8s" repeatCount="indefinite"/></circle><circle cx="804" cy="46" r="0.9"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.7s" begin="-4.7s" repeatCount="indefinite"/></circle><circle cx="560" cy="16" r="1.2"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="6.0s" begin="-2.9s" repeatCount="indefinite"/></circle><circle cx="712" cy="16" r="1.2"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="6.0s" begin="-2.4s" repeatCount="indefinite"/></circle><circle cx="666" cy="31" r="1.3"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="5.6s" begin="-0.3s" repeatCount="indefinite"/></circle><circle cx="66" cy="103" r="1.2"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.7s" begin="-2.7s" repeatCount="indefinite"/></circle><circle cx="877" cy="54" r="1.2"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="6.0s" begin="-2.3s" repeatCount="indefinite"/></circle><circle cx="390" cy="87" r="1.8"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.1s" begin="-3.8s" repeatCount="indefinite"/></circle><circle cx="966" cy="52" r="1.4"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="6.2s" begin="-1.3s" repeatCount="indefinite"/></circle><circle cx="967" cy="21" r="1.4"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="5.8s" begin="-1.8s" repeatCount="indefinite"/></circle><circle cx="625" cy="12" r="1.3"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="6.4s" begin="-1.0s" repeatCount="indefinite"/></circle><circle cx="1070" cy="86" r="1.2"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.9s" begin="-1.4s" repeatCount="indefinite"/></circle><circle cx="1136" cy="19" r="1.2"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.5s" begin="-0.9s" repeatCount="indefinite"/></circle><circle cx="180" cy="88" r="1.0"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="5.6s" begin="-5.0s" repeatCount="indefinite"/></circle></g>
      <g filter="url(#cloud)" fill="#e8b4d8" fill-opacity="0.22">
        <ellipse cx="260" cy="150" rx="150" ry="14"/><ellipse cx="210" cy="142" rx="70" ry="14"/>
        <animateTransform attributeName="transform" type="translate" values="-400 0;1100 0" dur="46s" begin="-18s" repeatCount="indefinite"/></g>
    </g>
  </defs>

  <rect width="1200" height="170" fill="url(#bg)"/>

  <!-- Ciel net autour du panneau, dépoli à travers le verre -->
  <use href="#sky"/>
  <g clip-path="url(#panel)">
    <rect width="1200" height="170" fill="url(#bg)"/>
    <g filter="url(#frost)"><use href="#sky"/></g>
    <rect x="70" y="30" width="1060" height="110" fill="url(#tint)"/>
    <rect x="70" y="30" width="1060" height="110" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="70" y="30" width="1060" height="110" fill="url(#sheen)"/>
    <!-- Reflet : une bande de lumière traverse le panneau de temps en temps -->
    <g>
      <rect x="-200" y="0" width="120" height="170" fill="url(#glint)" transform="skewX(-22)"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;1700 0;1700 0" keyTimes="0;0.4;1" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>
  <rect x="70.75" y="30.75" width="1058.5" height="108.5" rx="27.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

  <!-- Textes -->
  <text x="600" y="82" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5" fill="#ffffff">© 2026 DoX</text>
  <text x="600" y="115" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#ffffff" fill-opacity="0.88">Développeur Full-Stack</text>
</svg>

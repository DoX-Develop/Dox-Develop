<svg xmlns="http://www.w3.org/2000/svg" width="320" height="96" viewBox="0 0 320 96" role="img" aria-label="Me contacter">
  <title>Me contacter</title>
  <defs>
    <linearGradient id="base" x1="0" y1="8" x2="0" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a98f3"/>
      <stop offset="1" stop-color="#1d58c0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="68" x2="0" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fd0ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#8fd0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="8" x2="0" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="rim" x1="12" y1="8" x2="308" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.70"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="specular" x1="40" y1="0" x2="280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pill"><rect x="12" y="8" width="296" height="60" rx="30"/></clipPath>
    <filter id="blur6" x="-50%" y="-300%" width="200%" height="700%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur10" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <!-- Ombre au sol (et halo bleuté en mode sombre) -->
  <ellipse cx="160" cy="38" rx="150" ry="34" fill="#6fb0ff" fill-opacity="0.0" filter="url(#blur10)"/>
  <ellipse cx="160" cy="77" rx="118" ry="8" fill="#1d3f8f" fill-opacity="0.42" filter="url(#blur6)">
    <animate attributeName="rx" values="118;110;118" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="4.4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Le bouton flotte très légèrement -->
  <g>
    <rect x="12" y="8" width="296" height="60" rx="30" fill="url(#base)"/>

    <g clip-path="url(#pill)">
      <rect x="12" y="34" width="296" height="34" fill="url(#glow)"/>
      <rect x="12" y="8" width="296" height="34" fill="url(#sheen)"/>

      <!-- Reflet d'ambiance : une tache de lumière qui dérive lentement -->
      <ellipse cx="90" cy="20" rx="46" ry="9" fill="#ffffff" fill-opacity="0.22" filter="url(#blur6)">
        <animate attributeName="cx" values="90;230;90" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="9s" repeatCount="indefinite"/>
      </ellipse>

      <!-- Reflet principal : une bande de lumière balaie le verre, puis une pause -->
      <g>
        <rect x="-80" y="-10" width="64" height="100" fill="url(#sweep)" transform="skewX(-22)"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;450 0;450 0" keyTimes="0;0.42;1" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1" dur="6s" repeatCount="indefinite"/>
      </g>
      <!-- Second reflet, plus fin, juste derrière -->
      <g opacity="0.7">
        <rect x="-110" y="-10" width="18" height="100" fill="url(#sweep)" transform="skewX(-22)"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;450 0;450 0" keyTimes="0;0.42;1" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1" dur="6s" begin="0.18s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Liseré de verre et fine ligne de lumière sur le haut du bord -->
    <rect x="12.75" y="8.75" width="294.5" height="58.5" rx="29.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
    <path d="M44 12.2 H276" stroke="url(#specular)" stroke-width="1.6" stroke-linecap="round">
      <animate attributeName="opacity" values="0.45;1;0.45" keyTimes="0;0.2;1" dur="6s" repeatCount="indefinite"/>
    </path>

    <!-- Texte et icône -->
    <text x="142.0" y="46.6" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0.4" fill="#0b2a6f" fill-opacity="0.38">Me contacter</text>
    <text x="142.0" y="45.4" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0.4" fill="#ffffff">Me contacter</text>
    <g transform="translate(237.2 28)"><g fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="3.5" width="17" height="13" rx="3"/><path d="M2.5 5.5 L10 11.5 L17.5 5.5"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -1.6;0 0" dur="2.2s" repeatCount="indefinite"/></g></g>

    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2.5;0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="4.4s" repeatCount="indefinite"/>
  </g>
</svg>
